# Manual installer build. Not run on push, pull_request, or merge.
name: mac installers

on:
  workflow_dispatch:

jobs:
  pkg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Mac binaries
        run: |
          bash scripts/fetch-binaries.sh mac-arm64
          bash scripts/fetch-binaries.sh mac-x64
      - name: Build unsigned packages
        run: |
          bash scripts/build-pkg.sh mac-arm64
          bash scripts/build-pkg.sh mac-x64
          bash scripts/build-pkg.sh mac-universal
      - name: Build Mac zips and self-signed ZXP files
        run: |
          curl -fsSL -o ZXPSignCmd "https://raw.githubusercontent.com/Adobe-CEP/CEP-Resources/master/ZXPSignCMD/4.1.3/macOS/ZXPSignCmd"
          chmod +x ZXPSignCmd
          xattr -dr com.apple.quarantine ZXPSignCmd || true
          export ZXPSIGNCMD="$PWD/ZXPSignCmd"
          bash scripts/package.sh mac-arm64
          bash scripts/package.sh mac-x64
          bash scripts/fetch-binaries.sh win-x64
          bash scripts/sign-zxp.sh mac-arm64
          bash scripts/sign-zxp.sh mac-x64
          bash scripts/sign-zxp.sh win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ximporter-macos-pkgs
          path: |
            dist/*.pkg
            dist/*mac-*.zip
            dist/*.zxp
          if-no-files-found: error

  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Fetch Windows binaries
        run: bash scripts/fetch-binaries.sh win-x64
      - name: Build unsigned installer and Windows zip
        run: |
          bash scripts/build-exe.sh
          bash scripts/package.sh win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ximporter-windows-exe
          path: |
            dist/*.exe
            dist/*win-x64.zip
          if-no-files-found: error
